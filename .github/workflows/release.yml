# builds the encore app and its optional ai engine for mac, windows and linux and publishes them
# as a github release. bump APP_VERSION in backend/version.py, then push the matching tag:
# git tag app-v1.1.0 && git push origin app-v1.1.0
# the web version links to releases/latest, so a new release reaches the download page by itself.
name: Encore App

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: Encore-macOS.dmg
            engine: Encore-AI-macOS.tar.gz
            exe: dist/Encore.app/Contents/MacOS/Encore
          - os: windows-latest
            asset: Encore-Windows.zip
            engine: Encore-AI-Windows.zip
            exe: dist/Encore/Encore.exe
          - os: ubuntu-22.04
            asset: Encore-Linux.tar.gz
            engine: Encore-AI-Linux.tar.gz
            exe: dist/Encore/Encore
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches backend/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="app-v$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/version.py)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but backend/version.py says $want"; exit 1; }

      - name: Install
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          PY=.venv/bin/python
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; fi
          # linux: cpu-only torch (the default wheel bundles cuda, several gb)
          if [ "$RUNNER_OS" = Linux ]; then
            uv pip install --python $PY torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          uv pip install --python $PY -r backend/requirements.txt pyinstaller pillow
          uv pip install --python $PY --no-deps basic-pitch
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          $PY -m PyInstaller --noconfirm backend/encore.spec
          $PY -m PyInstaller --noconfirm backend/engine.spec

      # demucs / beat_this weights (~500 mb) for the smoke test, kept between releases
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-models-${{ runner.os }}-v1

      - name: Smoke test (a short clip in classic mode, then with the ai engine)
        shell: bash
        run: |
          ENGINE=dist/EncoreAI/EncoreAI
          if [ "$RUNNER_OS" = Windows ]; then ENGINE=dist/EncoreAI/EncoreAI.exe; fi
          $PY backend/smoke_test.py "${{ matrix.exe }}" "$ENGINE"

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir dmg && cp -R dist/Encore.app dmg/ && ln -s /Applications dmg/Applications
            hdiutil create -volname Encore -srcfolder dmg -ov -format UDZO "${{ matrix.asset }}"
          elif [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "${{ matrix.asset }}" ./dist/Encore
          else
            tar -czf "${{ matrix.asset }}" -C dist Encore
          fi
          # the engine unpacks to EncoreAI/ (backend/ai.py)
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "${{ matrix.engine }}" ./dist/EncoreAI
          else tar -czf "${{ matrix.engine }}" -C dist EncoreAI; fi
          ls -la "${{ matrix.asset }}" "${{ matrix.engine }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.engine }}
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Encore App ${{ github.ref_name }}
          make_latest: true
          files: |
            Encore-macOS.dmg
            Encore-Windows.zip
            Encore-Linux.tar.gz
            Encore-AI-macOS.tar.gz
            Encore-AI-Windows.zip
            Encore-AI-Linux.tar.gz
          body: |
            Encore App: Breakdown (pisahkan instrumen, not, chord, MIDI) jalan di komputermu sendiri.

            | Komputer | File | Cara buka pertama kali |
            |---|---|---|
            | Mac (chip Apple M1 ke atas) | `Encore-macOS.dmg` | Seret Encore ke Applications, buka. Kalau diblokir: System Settings → Privacy & Security → Open Anyway. Kalau muncul "rusak", jalankan `xattr -cr /Applications/Encore.app` di Terminal |
            | Windows 10/11 64-bit | `Encore-Windows.zip` | Extract, buka `Encore\Encore.exe`. Kalau muncul SmartScreen: More info → Run anyway |
            | Linux 64-bit | `Encore-Linux.tar.gz` | `tar -xzf Encore-Linux.tar.gz && ./Encore/Encore` |

            Encore terbuka sendiri di browser. Breakdown langsung jalan dengan **mode cepat** (tanpa AI).
            Mau lebih detail? Pilih **Detail (AI)** di dalam app: mesin AI (file `Encore-AI-*`) diunduh dan dipasang otomatis,
            lalu model AI ±500 MB saat lagu pertama. File `Encore-AI-*` tidak perlu diunduh manual.
